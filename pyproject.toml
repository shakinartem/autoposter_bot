[project]
name = "autoposter-bot"
version = "0.2.0"
description = "Web/API-first content distribution platform with Telegram, VK, Instagram, and TikTok adapters"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32.0",
  "python-dotenv>=1.0.1",
  "cloudinary>=1.44.1",
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "httpx>=0.27.0",
]

[project.scripts]
autoposter = "autoposter_bot.cli:main"
autoposter-api = "autoposter_bot.apps.api.runner:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["autoposter_bot*"]
