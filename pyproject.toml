[project]
name = "autoposter-bot"
version = "0.10.0"
description = "Workspace-scoped content distribution platform with encrypted credentials, media storage and revocable user sessions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32.0",
  "python-dotenv>=1.0.1",
  "cloudinary>=1.44.1",
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "psycopg[binary,pool]>=3.3,<4",
  "cryptography>=46,<51",
  "PyJWT[crypto]>=2.10,<3",
  "boto3>=1.40,<2",
  "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "httpx>=0.27.0",
]

[project.scripts]
autoposter = "autoposter_bot.cli:main"
autoposter-api = "autoposter_bot.apps.api.runner:main"
autoposter-worker = "autoposter_bot.apps.worker.runner:main"
autoposter-reconciler = "autoposter_bot.apps.reconciliation_worker.runner:main"
autoposter-workspace = "autoposter_bot.apps.workspace_cli:main"
autoposter-session = "autoposter_bot.apps.session_cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["autoposter_bot*"]