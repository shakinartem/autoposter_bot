name: Content OS Release CI

on:
  push:
    branches:
      - content-os-foundation
      - agent/content-factory-bridge-v2
      - agent/content-factory-bridge-v3
  pull_request:
    branches:
      - product-platform
      - content-os-foundation

permissions:
  contents: read

jobs:
  python:
    name: Python + PostgreSQL tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: autoposter_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d autoposter_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AUTOPOSTER_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/autoposter_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Compile all Python
        run: python -m compileall -q autoposter_bot scripts tests
      - name: Import bridge composition
        run: |
          python -c "from autoposter_bot.apps.api.content_factory_contract import ContentPackageV1; print(ContentPackageV1.__name__)"
          python -c "from autoposter_bot.apps.api.integrated_main import app; print(app.version)"
      - name: Run full test suite
        run: pytest -q

  web:
    name: Next.js typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  deploy:
    name: Production images + server contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Prepare production-like config
        run: |
          cat > .env.ci <<'EOF'
          QUALIVE_DOCKER_NETWORK=qualive-backbone
          AUTOPOSTER_ENV=production
          AUTOPOSTER_DOMAIN=autoposter.example.com
          POSTGRES_USER=autoposter
          POSTGRES_PASSWORD=ci-postgres-password-123456789
          POSTGRES_DB=autoposter
          AUTOPOSTER_WEB_URL=https://autoposter.example.com
          AUTOPOSTER_WEB_AUTH_MODE=session
          AUTOPOSTER_REQUIRE_API_AUTH=1
          AUTOPOSTER_ALLOWED_HOSTS=autoposter.example.com,autoposter-api,api,localhost,127.0.0.1
          AUTOPOSTER_CORS_ORIGINS=https://autoposter.example.com
          AUTOPOSTER_CREDENTIAL_KEYS=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          AUTOPOSTER_API_KEYS_JSON={}
          TELEGRAM_OIDC_CLIENT_ID=ci-telegram-client
          TELEGRAM_OIDC_CLIENT_SECRET=ci-telegram-secret-123456789
          TELEGRAM_OIDC_REDIRECT_URI=https://autoposter.example.com/auth/telegram/callback
          CONTENT_FACTORY_INGEST_TOKEN=ci-ingest-token-aaaaaaaaaaaaaaaaaaaaaaaa
          CONTENT_FACTORY_PERFORMANCE_URL=http://content-factory-api:8000/performance/ingest
          CONTENT_FACTORY_PERFORMANCE_TOKEN=ci-performance-token-bbbbbbbbbbbbbbbbbbbbbbbb
          CONTENT_FACTORY_MEDIA_REQUIRE_ALLOWLIST=true
          CONTENT_FACTORY_MEDIA_ALLOWED_HOSTS=assets.factory.example.com
          CONTENT_FACTORY_MEDIA_ALLOW_PRIVATE_HOSTS=false
          EOF
      - name: Server preflight
        run: python scripts/server-preflight.py --env .env.ci
      - name: Validate Compose
        run: docker compose --env-file .env.ci -f deploy/docker-compose.prod.yml config --quiet
      - name: Validate Caddy
        run: |
          docker run --rm \
            -e AUTOPOSTER_DOMAIN=autoposter.example.com \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Build Python runtime image
        run: docker build -t qualive-autoposter-ci .
      - name: Build Next.js runtime image
        run: docker build -t qualive-autoposter-web-ci ./web

  bundle:
    name: Immutable server release
    needs: [python, web, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    if: >-
      (github.event_name == 'push' && (github.ref_name == 'agent/content-factory-bridge-v2' || github.ref_name == 'agent/content-factory-bridge-v3')) ||
      (github.event_name == 'pull_request' && (github.head_ref == 'agent/content-factory-bridge-v2' || github.head_ref == 'agent/content-factory-bridge-v3'))
    env:
      FACTORY_SHA: c6c05c1ea7e2bdfa01f89c64cbc9ac73c3800489
      AUTOPOSTER_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      TESTED_MERGE_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact tested Autoposter head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: qualive-server-release/autoposter
          fetch-depth: 1
      - name: Checkout verified Content Factory
        uses: actions/checkout@v4
        with:
          repository: shakinartem/agency-os
          ref: c6c05c1ea7e2bdfa01f89c64cbc9ac73c3800489
          path: qualive-server-release/content-factory
          fetch-depth: 1
      - name: Build exact Content Factory server images
        run: |
          docker build -t qualive-factory-api-ci -f qualive-server-release/content-factory/docker/Dockerfile.api qualive-server-release/content-factory
          docker build -t qualive-factory-worker-ci -f qualive-server-release/content-factory/docker/Dockerfile.worker qualive-server-release/content-factory
          docker build -t qualive-factory-migrate-ci -f qualive-server-release/content-factory/docker/Dockerfile.migrate qualive-server-release/content-factory
          docker build -t qualive-factory-web-ci -f qualive-server-release/content-factory/docker/Dockerfile.web qualive-server-release/content-factory
      - name: Package immutable combined release
        run: |
          python qualive-server-release/autoposter/scripts/package_qualive_release.py \
            --root qualive-server-release \
            --factory-sha "$FACTORY_SHA" \
            --autoposter-sha "$AUTOPOSTER_HEAD_SHA" \
            --tested-merge-sha "$TESTED_MERGE_SHA" \
            --ci-run-id "$GITHUB_RUN_ID" \
            --ci-run-number "$GITHUB_RUN_NUMBER"
      - name: Validate shared edge and release integrity
        run: |
          docker run --rm \
            -e FACTORY_DOMAIN=factory.example.com \
            -e FACTORY_ASSETS_DOMAIN=assets.factory.example.com \
            -e AUTOPOSTER_DOMAIN=autoposter.example.com \
            -v "$PWD/qualive-server-release/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile
          (cd qualive-server-release && sha256sum -c SHA256SUMS)
          test -f qualive-server-release/content-factory/packages/database/alembic/versions/0014_audit_events.py
          test -f qualive-server-release/content-factory/packages/database/performance_learning.py
          test -f qualive-server-release/autoposter/autoposter_bot/application/account_health.py
          test -f qualive-server-release/autoposter/autoposter_bot/apps/api/content_factory_contract.py
          test -x qualive-server-release/deploy/up.sh
          test -f qualive-server-release/RELEASE_MANIFEST.json
          if find qualive-server-release -name .git -print -quit | grep -q .; then echo '.git leaked into release' >&2; exit 1; fi
      - name: Upload immutable release
        uses: actions/upload-artifact@v4
        with:
          name: qualive-server-release-${{ github.event.pull_request.head.sha || github.sha }}
          path: qualive-server-release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
