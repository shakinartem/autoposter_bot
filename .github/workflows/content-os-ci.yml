name: Content OS CI

on:
  push:
    branches:
      - content-os-foundation
  pull_request:
    branches:
      - product-platform
      - content-os-foundation

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Compile Python package
        run: python -m compileall autoposter_bot
      - name: Import integrated API
        env:
          CONTENT_FACTORY_INGEST_TOKEN: ci-content-factory-token
          AUTOPOSTER_DB_PATH: /tmp/autoposter-ci.sqlite3
          CONTENT_FACTORY_MEDIA_CACHE_DIR: /tmp/content-factory-media
        run: python -c "from autoposter_bot.apps.api.integrated_main import app; assert '/api/v1/integrations/content-factory/packages' in app.openapi()['paths']; print(app.version)"
      - name: Run tests
        run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install web dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Build web app
        run: npm run build
