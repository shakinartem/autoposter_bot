name: Content OS CI

on:
  push:
    branches:
      - content-os-foundation
  pull_request:
    branches:
      - product-platform
      - content-os-foundation

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: autoposter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d autoposter_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AUTOPOSTER_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/autoposter_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Compile Python package
        run: python -m compileall autoposter_bot
      - name: Import integrated API contract
        env:
          CONTENT_FACTORY_INGEST_TOKEN: ci-content-factory-token
          AUTOPOSTER_ANALYTICS_INGEST_TOKEN: ci-analytics-token
          AUTOPOSTER_DB_PATH: /tmp/autoposter-ci.sqlite3
        run: |
          python -c "from autoposter_bot.apps.api.integrated_main import app; paths=app.openapi()['paths']; assert '/api/v1/integrations/content-factory/packages' in paths; assert '/api/v1/integrations/content-factory/publications/{publication_id}/performance' in paths; print(app.version)"
      - name: Run tests
        run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install web dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Build web app
        run: npm run build