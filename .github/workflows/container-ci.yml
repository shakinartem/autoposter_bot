name: Container CI

on:
  push:
    branches:
      - product-platform
      - content-os-foundation
      - agent/content-factory-bridge-v2
      - agent/content-factory-bridge-v3
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "deploy/**"
      - "web/Dockerfile"
      - "web/.dockerignore"
      - "web/**"
      - "autoposter_bot/**"
      - "pyproject.toml"
      - ".github/workflows/container-ci.yml"

permissions:
  contents: read

jobs:
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Python runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          cache-from: type=gha,scope=autoposter-python
          cache-to: type=gha,mode=max,scope=autoposter-python
      - name: Build Next.js runtime image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          push: false
          cache-from: type=gha,scope=autoposter-web
          cache-to: type=gha,mode=max,scope=autoposter-web
      - name: Validate compose configuration
        env:
          AUTOPOSTER_DOMAIN: autoposter.example.com
          POSTGRES_PASSWORD: ci-url-safe-password
          CONTENT_FACTORY_MEDIA_ALLOWED_HOSTS: assets.factory.example.com
        run: |
          cp .env.example .env
          docker compose --env-file .env -f deploy/docker-compose.prod.yml config >/tmp/compose.yml
          test -s /tmp/compose.yml
      - name: Validate Caddy configuration
        env:
          AUTOPOSTER_DOMAIN: autoposter.example.com
        run: |
          docker run --rm \
            -e AUTOPOSTER_DOMAIN="$AUTOPOSTER_DOMAIN" \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Build exact-source archive
        run: |
          git archive --format=zip --output=autoposter-source.zip HEAD
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('autoposter-source.zip')
          print('source sha256', hashlib.sha256(p.read_bytes()).hexdigest())
          PY
      - name: Upload verified source archive
        uses: actions/upload-artifact@v4
        with:
          name: autoposter-source-${{ github.sha }}
          path: autoposter-source.zip
          if-no-files-found: error
          retention-days: 7
