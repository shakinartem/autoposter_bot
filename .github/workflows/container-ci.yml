name: Container CI

on:
  push:
    branches: [content-os-foundation]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "pyproject.toml"
      - "autoposter_bot/**"
      - "migrations/**"
      - "web/**"
      - "deploy/**"
      - ".github/workflows/container-ci.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "pyproject.toml"
      - "autoposter_bot/**"
      - "migrations/**"
      - "web/**"
      - "deploy/**"
      - ".github/workflows/container-ci.yml"

permissions:
  contents: read

jobs:
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Python runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: false
          cache-from: type=gha,scope=autoposter-python
          cache-to: type=gha,mode=max,scope=autoposter-python

      - name: Build Next.js runtime image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          push: false
          load: false
          cache-from: type=gha,scope=autoposter-web
          cache-to: type=gha,mode=max,scope=autoposter-web

      - name: Validate compose configuration
        env:
          AUTOPOSTER_DOMAIN: autoposter.example.com
          POSTGRES_PASSWORD: ci-url-safe-password
        run: |
          cp .env.example .env
          docker compose --env-file .env -f deploy/docker-compose.prod.yml config >/tmp/compose.yml
          test -s /tmp/compose.yml

      - name: Validate Caddy configuration
        run: |
          docker run --rm \
            -e AUTOPOSTER_DOMAIN=autoposter.example.com \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile

      - name: Build exact-source archive
        if: success()
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          short_sha="${SOURCE_SHA::12}"
          git archive --format=zip --prefix="autoposter-content-os-${short_sha}/" --output="autoposter-content-os-${short_sha}.zip" HEAD
          echo "ARCHIVE_PATH=autoposter-content-os-${short_sha}.zip" >> "$GITHUB_ENV"

      - name: Upload verified source archive
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: autoposter-source-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ env.ARCHIVE_PATH }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
