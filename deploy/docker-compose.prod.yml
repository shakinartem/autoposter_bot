services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-autoposter}
      POSTGRES_USER: ${POSTGRES_USER:-autoposter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-autoposter} -d ${POSTGRES_DB:-autoposter}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      AUTOPOSTER_DATABASE_URL: postgresql://${POSTGRES_USER:-autoposter}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-autoposter}
      AUTOPOSTER_WEB_URL: https://${AUTOPOSTER_DOMAIN:?AUTOPOSTER_DOMAIN is required}
      AUTOPOSTER_CORS_ORIGINS: https://${AUTOPOSTER_DOMAIN}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - app_data:/app/data
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [backend]

  publication-worker:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["autoposter-worker"]
    env_file: ../.env
    environment:
      AUTOPOSTER_DATABASE_URL: postgresql://${POSTGRES_USER:-autoposter}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-autoposter}
      AUTOPOSTER_WEB_URL: https://${AUTOPOSTER_DOMAIN}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - app_data:/app/data
    networks: [backend]

  analytics-worker:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "autoposter_bot.apps.analytics_worker.runner"]
    env_file: ../.env
    environment:
      AUTOPOSTER_DATABASE_URL: postgresql://${POSTGRES_USER:-autoposter}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-autoposter}
      AUTOPOSTER_WEB_URL: https://${AUTOPOSTER_DOMAIN}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - app_data:/app/data
    networks: [backend]

  reconciliation-worker:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["autoposter-reconciler"]
    env_file: ../.env
    environment:
      AUTOPOSTER_DATABASE_URL: postgresql://${POSTGRES_USER:-autoposter}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-autoposter}
      AUTOPOSTER_WEB_URL: https://${AUTOPOSTER_DOMAIN}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - app_data:/app/data
    networks: [backend]

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      AUTOPOSTER_API_URL: http://api:8000
      AUTOPOSTER_WEB_AUTH_MODE: session
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/login"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [backend]

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      AUTOPOSTER_DOMAIN: ${AUTOPOSTER_DOMAIN:?AUTOPOSTER_DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    networks: [backend]

volumes:
  postgres_data:
  app_data:
  caddy_data:
  caddy_config:

networks:
  backend:
    driver: bridge
